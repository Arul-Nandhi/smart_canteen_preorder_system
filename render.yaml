services:
  # ── Django Backend ──────────────────────────────────────
  - type: web
    name: smartcanteen-backend
    env: python
    plan: free
    region: singapore
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    startCommand: >
      python manage.py migrate --noinput &&
      python seed.py &&
      gunicorn smartserve_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: smartserve_backend.settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: smartcanteen
          property: connectionString

  # ── React Frontend ──────────────────────────────────────
  - type: web
    name: smartcanteen-frontend
    env: static
    region: singapore
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          name: smartcanteen-backend
          type: web
          property: host
          envVarKey: RENDER_EXTERNAL_URL

# ── PostgreSQL Database ─────────────────────────────────
databases:
  - name: smartcanteen
    databaseName: smartcanteen_db
    user: smartcanteen_user
    plan: free
    region: singapore

